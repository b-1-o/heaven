name: Switch conferences to Zoom app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[zoom-app-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace embedded Zoom meeting UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/WorkspaceFeatures.tsx')
          text = path.read_text()

          start = text.index('type ZoomEmbeddedClient = {')
          end = text.index('export function ConferenceRoomsView', start)
          replacement = '''function openZoomMeeting(meetingNumber: string, password = '') {\n  const cleanMeetingNumber = meetingNumber.replace(/\\s/g, '')\n  const params = new URLSearchParams({\n    action: 'join',\n    confno: cleanMeetingNumber,\n  })\n  if (password) params.set('pwd', password)\n\n  window.location.href = `zoommtg://zoom.us/join?${params.toString()}`\n}\n\n'''
          text = text[:start] + replacement + text[end:]

          old_open = '''    if (activeRoom.zoomMeetingNumber) {\n      onNotify('Joining ' + activeRoom.name)\n      return\n    }'''
          new_open = '''    if (activeRoom.zoomMeetingNumber) {\n      onNotify('Opening ' + activeRoom.name + ' in Zoom')\n      openZoomMeeting(activeRoom.zoomMeetingNumber, activeRoom.zoomPassword)\n      return\n    }'''
          if old_open not in text:
              raise SystemExit('Could not find Zoom room handler')
          text = text.replace(old_open, new_open, 1)

          old_stage = '''          {joined && activeRoom.zoomMeetingNumber ? (\n            <ZoomMeetingEmbed\n              meetingNumber={activeRoom.zoomMeetingNumber}\n              password={activeRoom.zoomPassword}\n              onError={(message) => setZoomError(message)}\n            />\n          ) : ('''
          new_stage = '''          {joined && activeRoom.zoomMeetingNumber ? (\n            <div className="video-grid zoom-external-stage">\n              <div className="video-empty">\n                <Video size={22} />\n                <strong>Zoom is opening</strong>\n                <span>The conference will continue in the Zoom desktop app.</span>\n                <button className="glass-button solid" onClick={() => openZoomMeeting(activeRoom.zoomMeetingNumber!, activeRoom.zoomPassword)}>\n                  <ExternalLink size={14} /> Reopen Zoom\n                </button>\n              </div>\n            </div>\n          ) : ('''
          if old_stage not in text:
              raise SystemExit('Could not find embedded Zoom stage')
          text = text.replace(old_stage, new_stage, 1)

          old_controls = '''          {joined && activeRoom.zoomMeetingNumber ? (\n            <div className="room-controls zoom-room-controls">\n              <span className="zoom-control-note"><Radio size={14} /> Zoom is embedded in HEAVEN</span>\n              <button className="room-control danger" onClick={() => { setJoined(false); onNotify('You left the room') }}><Phone size={16} /><span>Leave</span></button>\n            </div>\n          ) : ('''
          new_controls = '''          {joined && activeRoom.zoomMeetingNumber ? (\n            <div className="room-controls zoom-room-controls">\n              <span className="zoom-control-note"><ExternalLink size={14} /> Zoom desktop app</span>\n              <button className="room-control danger" onClick={() => { setJoined(false); onNotify('Room closed') }}><Phone size={16} /><span>Close</span></button>\n            </div>\n          ) : ('''
          if old_controls not in text:
              raise SystemExit('Could not find embedded Zoom controls')
          text = text.replace(old_controls, new_controls, 1)

          text = text.replace('import {\n  ArrowUpRight,', 'import {\n  ArrowUpRight,')
          text = text.replace('  CalendarDays,', '  CalendarDays,\n  ExternalLink,', 1) if '  ExternalLink,' not in text else text
          text = text.replace('  useEffect, useMemo, useRef, useState', '  useEffect, useMemo, useRef, useState')

          path.write_text(text)
      - name: Verify source
        run: |
          grep -q "function openZoomMeeting" src/WorkspaceFeatures.tsx
          ! grep -q "ZoomMeetingEmbed" src/WorkspaceFeatures.tsx
          ! grep -q "/api/meetings/zoom/sdk" src/WorkspaceFeatures.tsx

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WorkspaceFeatures.tsx .github/workflows/zoom-external.yml
          git commit -m "refactor: launch Zoom conferences in desktop app [zoom-app-migrated]"
          git push

      - name: Remove migration workflow
        if: success()
        run: |
          git rm .github/workflows/zoom-external.yml
          git commit -m "chore: remove one-time Zoom migration [zoom-app-migrated]"
          git push
